<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Restaurant POS · Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font: 16px/1.5 system-ui, sans-serif;
            color: #0f172a;
            background: #f8fafc;
        }
        main {
            width: min(100%, 28rem);
            padding: 2rem;
            text-align: center;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 16px 40px rgb(15 23 42 / 8%);
        }
        .icon { font-size: 2.5rem; }
        h1 { margin: .75rem 0 .4rem; font-size: 1.4rem; }
        p { margin: 0 0 1.25rem; color: #64748b; }
        button {
            border: 0;
            border-radius: .6rem;
            padding: .7rem 1rem;
            color: white;
            background: #2563eb;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="icon">📡</div>
        <h1>No network connection</h1>
        <p>If the POS was opened previously, return to its cached tab. Pending orders will synchronize after connectivity returns.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
