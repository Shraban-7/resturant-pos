; Production PHP settings for the Restaurant POS runtime.
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
max_input_time = 60
expose_php = Off
date.timezone = UTC

; Keep real errors in the logs, never in HTTP responses.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

realpath_cache_size = 4096K
realpath_cache_ttl = 600
